<script>
  AFRAME.registerComponent("gallery", {
    schema: { galleryId: {type: "string"} },
    init: function () {
      const el = this.el;
      const galleryId = this.data.galleryId;
      const images = galleryData[galleryId];

      if (!images || images.length === 0) {
        console.warn("No gallery found for:", galleryId);
        return;
      }

      let currentIndex = 0;
      const imageEl = el.querySelector(".gallery-image");
      const titleEl = el.querySelector(".gallery-title");
      const descriptionEl = el.querySelector(".gallery-description");
      const counterEl = el.querySelector(".gallery-counter");

      function updateImage() {
        imageEl.setAttribute("src", images[currentIndex].image);
        titleEl.setAttribute("value", images[currentIndex].title);
        descriptionEl.setAttribute("value", images[currentIndex].description);
        if (counterEl) {
          counterEl.setAttribute("value", (currentIndex + 1) + " / " + images.length);
        }
      }

      el.querySelector(".gallery-next").addEventListener("click", function () {
        currentIndex = (currentIndex + 1) % images.length;
        updateImage();
      });

      el.querySelector(".gallery-prev").addEventListener("click", function () {
        currentIndex = (currentIndex - 1 + images.length) % images.length;
        updateImage();
      });

      updateImage();
    }
  });
</script>

<script>
  AFRAME.registerComponent("gallery-toggle", {
    init: function () {
      const button = this.el;
      function toggleGallery() {
        const gallerySelector = button.getAttribute("data-gallery");
        const gallery = document.querySelector(gallerySelector);
        if (!gallery) return;
        const currentVisibility = gallery.getAttribute("visible");
        gallery.setAttribute("visible", !currentVisibility);
      }

      button.addEventListener("mousedown", function (event) {
        event.stopPropagation();
        toggleGallery();
      });

      button.addEventListener("touchstart", function (event) {
        event.preventDefault();
        event.stopPropagation();
        toggleGallery();
      });
    }
  });
</script>
